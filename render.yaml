services:
  # 1. Backend Web Service (Node.js + Express + TypeScript + Prisma)
  - type: web
    name: pehchaan-backend
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: /api/v1
      - key: CORS_ORIGIN
        value: https://pehchaan-skit021.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: lax
      - key: STORAGE_PROVIDER
        value: local
      - key: STORAGE_LOCAL_DIR
        value: ./uploads/evidence

  # 2. Frontend Static Site (React 19 + Vite)
  - type: web
    name: skit021-student-platform
    env: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://pehchaan-backend-qkyn.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
